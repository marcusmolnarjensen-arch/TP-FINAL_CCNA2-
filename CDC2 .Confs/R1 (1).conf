! ============================================================
! R1 - Siege, hub DMVPN, pair IPsec de R4
! TP Final CDC 2 : IPsec site-a-site et DMVPN (EIGRP AS 100 du CDC 1 conserve)
! Configuration finale, reprise du show running-config
! Les cles pre-partagees et la chaine d'authentification NHRP sont remplacees
! par ***** (elles ne sont pas publiees). Les lignes '!' vides sont regroupees.
! ============================================================
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname R1
!
boot-start-marker
boot-end-marker
!
no aaa new-model
no ip icmp rate-limit unreachable
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
ip tcp synwait-time 5
!
! --- Phase 1 IKE (IKEv1) : AES-256, SHA-256, Diffie-Hellman groupe 14, cle pre-partagee ---
crypto isakmp policy 10
 encr aes 256
 hash sha256
 authentication pre-share
 group 14
! Cle de l'IPsec site-a-site (pair 172.16.255.4)
crypto isakmp key ***** address 172.16.255.4
! Cle commune du DMVPN (tous les pairs : les spokes se decouvrent dynamiquement)
crypto isakmp key ***** address 0.0.0.0
!
! --- Phase 2 IPsec du site-a-site : ESP en mode tunnel (chiffre le paquet d'origine en entier) ---
crypto ipsec transform-set TS-AES256-SHA256 esp-aes 256 esp-sha256-hmac
 mode tunnel
! --- Phase 2 IPsec du DMVPN : ESP en mode transport (le tunnel GRE apporte deja l'encapsulation) ---
crypto ipsec transform-set TS-DMVPN esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto ipsec profile IPSEC-DMVPN
 set transform-set TS-DMVPN
!
! --- IPsec site-a-site R1 <-> R4 (carte appliquee sur toutes les interfaces de sortie possibles) ---
crypto map CM-SITE2SITE local-address Loopback1
crypto map CM-SITE2SITE 10 ipsec-isakmp
 set peer 172.16.255.4
 set transform-set TS-AES256-SHA256
 set pfs group14
 match address ACL-VPN-LAN1-LAN2
!
! --- Loopback1 : source des tunnels (adresse NBMA stable, annoncee dans EIGRP, passive) ---
interface Loopback1
 description Source tunnels R1
 ip address 172.16.255.1 255.255.255.255
!
! --- DMVPN : Tunnel0 hub (mGRE + NHRP, redirect pour le chemin direct entre spokes) ---
! ip hello-interval eigrp 100 5 et ip hold-time eigrp 100 15 ont ete saisis ; IOS ne les affiche pas
! car ils correspondent aux valeurs par defaut de cette interface (hold observe : 11 a 12 s).
interface Tunnel0
 description DMVPN hub
 bandwidth 1000
 ip address 172.16.0.1 255.255.255.0
 no ip redirects
 ip mtu 1400
 no ip split-horizon eigrp 100
 ip nhrp authentication *****
 ip nhrp map multicast dynamic
 ip nhrp network-id 100
 ip nhrp redirect
 ip tcp adjust-mss 1360
 tunnel source Loopback1
 tunnel mode gre multipoint
 tunnel key 100
 tunnel protection ipsec profile IPSEC-DMVPN
!
interface FastEthernet0/0
 description LAN siege vers PC1
 ip address 192.168.0.1 255.255.255.0
 duplex full
!
interface FastEthernet1/0
 description Lien1 vers R2 Fa0/0
 ip address 192.168.1.0 255.255.255.254
 speed auto
 duplex auto
 crypto map CM-SITE2SITE
!
interface FastEthernet1/1
 description Lien5 vers R5 Fa0/0
 ip address 192.168.5.0 255.255.255.254
 speed auto
 duplex auto
 crypto map CM-SITE2SITE
!
interface Serial2/0
 description Lien4 serie vers R4 Se3/0
 ip address 192.168.4.0 255.255.255.254
 serial restart-delay 0
 crypto map CM-SITE2SITE
!
! --- Interfaces inutilisees : eteintes (shutdown) ---
interface Serial2/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial2/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial2/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface GigabitEthernet6/0
 no ip address
 shutdown
 negotiation auto
!
! --- EIGRP AS 100 (CDC 1) etendu au tunnel ---
! Les distribute-list empechent le tunnel d'apprendre ou d'annoncer les loopbacks 172.16.255.x
! (sinon le tunnel pourrait s'appuyer sur lui-meme). Aucune authentification EIGRP n'est configuree.
router eigrp 100
 distribute-list prefix PL-NO-NBMA in Tunnel0
 distribute-list prefix PL-NO-NBMA out Tunnel0
 network 172.16.0.0 0.0.0.255
 network 172.16.255.1 0.0.0.0
 network 192.168.0.0
 network 192.168.1.0 0.0.0.1
 network 192.168.4.0 0.0.0.1
 network 192.168.5.0 0.0.0.1
 passive-interface FastEthernet0/0
 passive-interface Loopback1
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
! ACL du trafic a chiffrer par l'IPsec site-a-site (LAN siege vers LAN entrepot)
ip access-list extended ACL-VPN-LAN1-LAN2
 permit ip 192.168.0.0 0.0.0.255 192.168.7.0 0.0.0.255
!
ip prefix-list PL-NO-NBMA seq 5 deny 172.16.255.0/24 le 32
ip prefix-list PL-NO-NBMA seq 10 permit 0.0.0.0/0 le 32
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
