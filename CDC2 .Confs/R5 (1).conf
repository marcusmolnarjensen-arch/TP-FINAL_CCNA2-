! ============================================================
! R5 - Relais Internet, spoke DMVPN
! TP Final CDC 2 : IPsec site-a-site et DMVPN (EIGRP AS 100 du CDC 1 conserve)
! Configuration finale, reprise du show running-config
! Les cles pre-partagees et la chaine d'authentification NHRP sont remplacees
! par ***** (elles ne sont pas publiees). Les lignes '!' vides sont regroupees.
! ============================================================
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname R5
!
boot-start-marker
boot-end-marker
!
no aaa new-model
no ip icmp rate-limit unreachable
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
ip tcp synwait-time 5
!
! --- Phase 1 IKE (IKEv1) : AES-256, SHA-256, Diffie-Hellman groupe 14, cle pre-partagee ---
crypto isakmp policy 10
 encr aes 256
 hash sha256
 authentication pre-share
 group 14
! Cle commune du DMVPN (tous les pairs : les spokes se decouvrent dynamiquement)
crypto isakmp key ***** address 0.0.0.0
!
! --- Phase 2 IPsec du DMVPN : ESP en mode transport (le tunnel GRE apporte deja l'encapsulation) ---
crypto ipsec transform-set TS-DMVPN esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto ipsec profile IPSEC-DMVPN
 set transform-set TS-DMVPN
!
! --- Nuage simule : Loopback0 10.40.10.1/24 (TP fait a distance du reseau de la classe) ---
interface Loopback0
 description Nuage simule 10.40.10.1
 ip address 10.40.10.1 255.255.255.0
!
! --- Loopback1 : source des tunnels (adresse NBMA stable, annoncee dans EIGRP, passive) ---
interface Loopback1
 description Source tunnels R5
 ip address 172.16.255.5 255.255.255.255
!
! --- DMVPN : Tunnel0 spoke (enregistrement aupres du hub, shortcut pour les tunnels directs) ---
! bandwidth 1000 : le tunnel reste moins bon que l'underlay dans le calcul EIGRP (le CDC 1 garde ses chemins).
! ip hello-interval eigrp 100 5 et ip hold-time eigrp 100 15 saisis, non affiches (valeurs par defaut).
interface Tunnel0
 description DMVPN Spoke R5
 bandwidth 1000
 ip address 172.16.0.5 255.255.255.0
 no ip redirects
 ip mtu 1400
 ip nhrp authentication *****
 ip nhrp map 172.16.0.1 172.16.255.1
 ip nhrp map multicast 172.16.255.1
 ip nhrp network-id 100
 ip nhrp nhs 172.16.0.1
 ip nhrp shortcut
 ip tcp adjust-mss 1360
 tunnel source Loopback1
 tunnel mode gre multipoint
 tunnel key 100
 tunnel protection ipsec profile IPSEC-DMVPN
!
interface FastEthernet0/0
 description Lien5 vers R1 Fa1/1
 ip address 192.168.5.1 255.255.255.254
 duplex full
!
interface FastEthernet1/0
 description Lien6 vers R4 Fa0/0
 ip address 192.168.6.0 255.255.255.254
 duplex full
!
! --- Interfaces inutilisees : eteintes (shutdown) ---
interface FastEthernet2/0
 no ip address
 shutdown
 duplex full
!
interface Serial3/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/3
 no ip address
 shutdown
 serial restart-delay 0
!
! --- EIGRP AS 100 (CDC 1) etendu au tunnel ---
! Les distribute-list empechent le tunnel d'apprendre ou d'annoncer les loopbacks 172.16.255.x
! (sinon le tunnel pourrait s'appuyer sur lui-meme). Aucune authentification EIGRP n'est configuree.
router eigrp 100
 distribute-list prefix PL-NO-NBMA in Tunnel0
 distribute-list prefix PL-NO-NBMA out Tunnel0
 network 10.40.10.0 0.0.0.255
 network 172.16.0.0 0.0.0.255
 network 172.16.255.5 0.0.0.0
 network 192.168.5.0 0.0.0.1
 network 192.168.6.0 0.0.0.1
 passive-interface Loopback0
 passive-interface Loopback1
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
ip prefix-list PL-NO-NBMA seq 5 deny 172.16.255.0/24 le 32
ip prefix-list PL-NO-NBMA seq 10 permit 0.0.0.0/0 le 32
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
