! ============================================================
! R3 - Coeur
! TP Final CDC 1 : routage dynamique EIGRP (AS 100)
! Configuration finale, reprise du show running-config du 12/10/2026
! (les lignes '!' vides ont ete regroupees ; aucune commande modifiee)
! ============================================================
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname R3
!
boot-start-marker
boot-end-marker
!
no aaa new-model
no ip icmp rate-limit unreachable
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
ip tcp synwait-time 5
!
! --- Lien 3 : R3 Fa0/0 <-> R4 Fa1/0 (cablage reel, verifie par CDP) - 192.168.3.0/31 ---
! Le cablage de R3 est inverse par rapport au dessin GNS3 : les adresses suivent le cablage reel.
interface FastEthernet0/0
 description Lien3 vers R4 Fa1/0
 ip address 192.168.3.0 255.255.255.254
 duplex full
!
! --- Lien 2 : R3 Fa1/0 <-> R2 Fa1/0 - 192.168.2.0/31 ---
interface FastEthernet1/0
 description Lien2 vers R2 Fa1/0
 ip address 192.168.2.1 255.255.255.254
 duplex full
!
! --- EIGRP AS 100 ---
! Les reseaux sont declares avec un wildcard : 0.0.0.1 pour un lien /31, 0.0.0.255 pour un LAN /24.
! Le running-config affiche parfois 'network x.x.x.0' sans wildcard (commande saisie avec 0.0.0.255).
! 'no auto-summary' a ete saisi ; IOS 15.2 ne l'affiche pas, et les routes apprises sont bien des
! sous-reseaux (/31, /24), donc sans resume automatique.
router eigrp 100
 network 192.168.2.0 0.0.0.1
 network 192.168.3.0 0.0.0.1
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
