! ============================================================
! R4 - Entrepot (Edge VPC2)
! TP Final CDC 1 : routage dynamique EIGRP (AS 100)
! Configuration finale, reprise du show running-config du 12/10/2026
! (les lignes '!' vides ont ete regroupees ; aucune commande modifiee)
! ============================================================
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname R4
!
boot-start-marker
boot-end-marker
!
no aaa new-model
no ip icmp rate-limit unreachable
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
ip tcp synwait-time 5
!
! --- Lien 6 : R4 Fa0/0 <-> R5 Fa1/0 - 192.168.6.0/31 ---
interface FastEthernet0/0
 description Lien6 vers R5 Fa1/0
 ip address 192.168.6.1 255.255.255.254
 duplex full
!
! --- Lien 3 : R4 Fa1/0 <-> R3 Fa0/0 (cablage reel, verifie par CDP) - 192.168.3.0/31 ---
interface FastEthernet1/0
 description Lien3 vers R3 Fa0/0
 ip address 192.168.3.1 255.255.255.254
 duplex full
!
! --- LAN entrepot 192.168.7.0/24 vers PC2 (interface passive dans EIGRP) ---
interface FastEthernet2/0
 description LAN entrepot vers PC2
 ip address 192.168.7.1 255.255.255.0
 duplex full
!
! --- Lien 4 : liaison serie R4 Se3/0 <-> R1 Se2/0 - 192.168.4.0/31 (chemin de secours) ---
! Encapsulation HDLC par defaut, aucun clock rate configure (liaison up/up sous GNS3)
interface Serial3/0
 description Lien4 serie vers R1 Se2/0
 ip address 192.168.4.1 255.255.255.254
 serial restart-delay 0
!
! --- Interfaces inutilisees : eteintes (shutdown) ---
interface Serial3/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/3
 no ip address
 shutdown
 serial restart-delay 0
!
! --- EIGRP AS 100 ---
! passive-interface : le LAN entrepot ne forme aucun voisinage mais reste annonce.
! Les reseaux sont declares avec un wildcard : 0.0.0.1 pour un lien /31, 0.0.0.255 pour un LAN /24.
! Le running-config affiche parfois 'network x.x.x.0' sans wildcard (commande saisie avec 0.0.0.255).
! 'no auto-summary' a ete saisi ; IOS 15.2 ne l'affiche pas, et les routes apprises sont bien des
! sous-reseaux (/31, /24), donc sans resume automatique.
router eigrp 100
 network 192.168.3.0 0.0.0.1
 network 192.168.4.0 0.0.0.1
 network 192.168.6.0 0.0.0.1
 network 192.168.7.0
 passive-interface FastEthernet2/0
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
