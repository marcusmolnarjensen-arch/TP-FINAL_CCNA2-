! ============================================================
! R5 - Relais Internet
! TP Final CDC 1 : routage dynamique EIGRP (AS 100)
! Configuration finale, reprise du show running-config du 12/10/2026
! (les lignes '!' vides ont ete regroupees ; aucune commande modifiee)
! ============================================================
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname R5
!
boot-start-marker
boot-end-marker
!
no aaa new-model
no ip icmp rate-limit unreachable
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
ip tcp synwait-time 5
!
! --- Nuage simule : Loopback0 10.40.10.1/24 (TP fait a distance du reseau de la classe) ---
interface Loopback0
 description Nuage simule 10.40.10.1
 ip address 10.40.10.1 255.255.255.0
!
! --- Lien 5 : R5 Fa0/0 <-> R1 Fa1/1 - 192.168.5.0/31 ---
interface FastEthernet0/0
 description Lien5 vers R1 Fa1/1
 ip address 192.168.5.1 255.255.255.254
 duplex full
!
! --- Lien 6 : R5 Fa1/0 <-> R4 Fa0/0 - 192.168.6.0/31 ---
interface FastEthernet1/0
 description Lien6 vers R4 Fa0/0
 ip address 192.168.6.0 255.255.255.254
 duplex full
!
! --- Interfaces inutilisees : eteintes (shutdown) ---
interface FastEthernet2/0
 no ip address
 shutdown
 duplex full
!
interface Serial3/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/3
 no ip address
 shutdown
 serial restart-delay 0
!
! --- EIGRP AS 100 ---
! passive-interface : la loopback (nuage simule) ne forme aucun voisinage mais reste annoncee.
! Les reseaux sont declares avec un wildcard : 0.0.0.1 pour un lien /31, 0.0.0.255 pour un LAN /24.
! Le running-config affiche parfois 'network x.x.x.0' sans wildcard (commande saisie avec 0.0.0.255).
! 'no auto-summary' a ete saisi ; IOS 15.2 ne l'affiche pas, et les routes apprises sont bien des
! sous-reseaux (/31, /24), donc sans resume automatique.
router eigrp 100
 network 10.40.10.0 0.0.0.255
 network 192.168.5.0 0.0.0.1
 network 192.168.6.0 0.0.0.1
 passive-interface Loopback0
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
